name: paper-pipeline-smoke

on:
  push:
    branches: [main]
    paths:
      - "src/rl_bgd/experiments/**"
      - "src/rl_bgd/artifacts/**"
      - "src/rl_bgd/analysis/**"
      - "src/rl_bgd/runners/sac_lqr.py"
      - "src/rl_bgd/runners/bgd_sac_lqr.py"
      - "src/rl_bgd/runners/ppo_lqr.py"
      - "tests/integration/test_paper_pipeline_smoke.py"
      - ".github/workflows/paper-pipeline-smoke.yml"
  pull_request:
    paths:
      - "src/rl_bgd/experiments/**"
      - "src/rl_bgd/artifacts/**"
      - "src/rl_bgd/analysis/**"
      - "src/rl_bgd/runners/sac_lqr.py"
      - "src/rl_bgd/runners/bgd_sac_lqr.py"
      - "src/rl_bgd/runners/ppo_lqr.py"
      - "tests/integration/test_paper_pipeline_smoke.py"
      - ".github/workflows/paper-pipeline-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run paper pipeline smoke
        run: pytest tests/integration/test_paper_pipeline_smoke.py -m slow -q
