name: one-pass-repo-normalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff==0.16.10"
      - name: Apply safe Ruff fixes
        run: ruff check --fix src tests scripts
      - name: Format repository Python
        run: ruff format src tests scripts
      - name: Commit mechanical normalization
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "normalize repository Python formatting"
          git push origin HEAD:main
