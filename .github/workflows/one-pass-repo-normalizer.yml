name: one-pass-repo-normalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff==0.16.10"
      - name: Normalize latest main with bounded fast-forward retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            ruff check --fix src tests scripts
            ruff format src tests scripts

            if git diff --quiet; then
              echo "No normalization changes required."
              exit 0
            fi

            git add src tests scripts
            git commit -m "normalize repository Python formatting"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced during normalization; retrying from latest main"
          done

          echo "Unable to obtain a fast-forward normalization window."
          exit 1
