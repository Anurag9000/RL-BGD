name: ruff-format-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ruff-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'add one-shot Ruff formatter'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Ruff version
        run: python -m pip install "ruff==0.16.10"
      - name: Format repository Python surfaces
        run: ruff format src tests scripts
      - name: Commit formatter output to main
        run: |
          if git diff --quiet -- src tests scripts; then
            echo "No Ruff formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "apply Ruff formatting"
          git push origin HEAD:main
