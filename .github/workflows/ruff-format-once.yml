name: ruff-format-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ruff-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          ruff check --fix src tests scripts
          ruff format src tests scripts

      - name: Commit formatting
        run: |
          if git diff --quiet -- src tests scripts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "RL-BGD formatter"
          git config user.email "actions@users.noreply.github.com"
          git add src tests scripts
          git commit -m "format Python sources with Ruff"
          git push origin HEAD:main
