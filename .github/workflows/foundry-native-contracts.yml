name: Foundry native contracts
on:
  push:
    branches: [main]
    paths:
      - "run_all_training.py"
      - "src/rl_bgd/**"
      - "scripts/**"
      - "tests/integration/test_foundry_scientific_inventory.py"
      - "tests/integration/test_foundry_entrypoint_census.py"
      - "foundry_integration/**"
      - "docs/foundry_integration/**"
      - "requirements-foundry.txt"
      - ".github/workflows/foundry-native-contracts.yml"
  workflow_dispatch:
concurrency:
  group: foundry-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source integrity
        run: python docs/foundry_integration/verify_source.py
      - name: Compile native controller and adapters
        run: python -m compileall -q run_all_training.py foundry_integration
      - name: Native subprocess bridge contracts
        run: python foundry_integration/test_bridge.py

  scientific-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native scientific inventory dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify registry completeness, fingerprints and native exports
        run: pytest -q tests/integration/test_foundry_scientific_inventory.py tests/integration/test_foundry_entrypoint_census.py
      - name: Materialize source-derived inventory (no training)
        run: python run_all_training.py inventory --write-inventory --out artifacts/foundry_inventory
      - name: Summarize source-derived scientific identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/foundry_inventory/scientific_job_coverage.json").read_text())
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Summarize independently reachable runner candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/foundry_inventory/native_entrypoint_coverage.json").read_text())
          excerpt = {
              "schema_version": report["schema_version"],
              "runner_modules_scanned": report["runner_modules_scanned"],
              "runner_public_callable_count": report["runner_public_callable_count"],
              "runner_callable_classifications": report["runner_callable_classifications"],
              "registered_non_runner_targets": report["registered_non_runner_targets"],
              "suite_targets_absent_from_public_runner_definitions": report["suite_targets_absent_from_public_runner_definitions"],
              "independent_runner_candidates": report["independent_runner_candidates"],
              "unmatched_import_candidates": report["unmatched_import_candidates"],
          }
          print(json.dumps(excerpt, indent=2, sort_keys=True))
          PY
      - name: Preserve scientific and entrypoint inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: rl-bgd-native-scientific-inventory
          path: |
            artifacts/foundry_inventory/scientific_job_inventory.json
            artifacts/foundry_inventory/scientific_job_inventory.csv
            artifacts/foundry_inventory/scientific_job_coverage.json
            artifacts/foundry_inventory/native_entrypoint_coverage.json
          if-no-files-found: error
          retention-days: 30
