name: Foundry native contracts
on:
  push:
    branches: [main]
    paths:
      - "run_all_training.py"
      - "src/rl_bgd/experiments/suites.py"
      - "tests/integration/test_foundry_scientific_inventory.py"
      - "foundry_integration/**"
      - "docs/foundry_integration/**"
      - "requirements-foundry.txt"
      - ".github/workflows/foundry-native-contracts.yml"
  workflow_dispatch:
jobs:
  native-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source integrity
        run: python docs/foundry_integration/verify_source.py
      - name: Compile native controller and adapters
        run: python -m compileall -q run_all_training.py foundry_integration
      - name: Native subprocess bridge contracts
        run: python foundry_integration/test_bridge.py

  scientific-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native scientific inventory dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify registry completeness, fingerprints and native exports
        run: pytest -q tests/integration/test_foundry_scientific_inventory.py tests/integration/test_foundry_entrypoint_census.py
      - name: Materialize source-derived inventory (no training)
        run: python run_all_training.py inventory --write-inventory --out artifacts/foundry_inventory
      - name: Summarize source-derived scientific identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/foundry_inventory/scientific_job_coverage.json").read_text())
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
