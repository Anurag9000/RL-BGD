name: cora-chores-smoke

on:
  workflow_dispatch:
    inputs:
      chores_archive_url:
        description: "Authoritative CORA CHORES trajectory archive URL"
        required: true
        type: string
      chores_archive_sha256:
        description: "Optional expected SHA-256 for the archive"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cora-chores:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            unzip \
            libglib2.0-0 \
            libgl1 \
            libnss3 \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxtst6

      - name: Install isolated historical runtime
        run: |
          python -m pip install --upgrade "pip<25" "setuptools==59.5.0" wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.2.2" "torchvision==0.17.2"
          python -m pip install \
            "numpy==1.23.5" \
            "gym==0.25.2" \
            "opencv-python-headless==4.8.1.78" \
            "pandas==1.5.3" \
            "networkx==2.8.8" \
            "h5py==3.10.0" \
            "tqdm==4.66.5" \
            "vocab==0.0.5" \
            "revtok==0.0.3" \
            "Pillow==10.4.0" \
            "ai2thor==3.3.5"

          git clone https://github.com/etaoxing/crl_alfred.git /tmp/crl_alfred
          git -C /tmp/crl_alfred checkout 9539acc290f7a8cd70099e04df94cec2a5452e71
          python -m pip install --no-deps -e /tmp/crl_alfred

          git clone https://github.com/AGI-Labs/continual_rl.git /tmp/continual_rl
          git -C /tmp/continual_rl checkout f2754bb282757829765beb4703f24b87efa13ff9
          python -m pip install --no-deps -e /tmp/continual_rl

          python - <<'PY'
          import gym
          import numpy
          import torch
          import ai2thor
          print("numpy", numpy.__version__)
          print("gym", gym.__version__)
          print("torch", torch.__version__)
          print("ai2thor", getattr(ai2thor, "__version__", "unknown"))
          assert numpy.__version__ == "1.23.5"
          assert gym.__version__ == "0.25.2"
          PY

      - name: Download supplied CORA CHORES trajectories
        env:
          CHORES_ARCHIVE_URL: ${{ inputs.chores_archive_url }}
          CHORES_ARCHIVE_SHA256: ${{ inputs.chores_archive_sha256 }}
        run: |
          test -n "$CHORES_ARCHIVE_URL"
          curl --fail --location --retry 3 --output /tmp/cora_trajs.zip "$CHORES_ARCHIVE_URL"
          if [ -n "$CHORES_ARCHIVE_SHA256" ]; then
            echo "$CHORES_ARCHIVE_SHA256  /tmp/cora_trajs.zip" | sha256sum --check -
          fi
          unzip -q /tmp/cora_trajs.zip -d /tmp/cora_data

      - name: Validate complete published CHORES archive
        id: chores-data
        run: |
          metadata_root="/tmp/continual_rl/continual_rl/experiments/tasks/metadata/chores"
          root="$(python scripts/validate_cora_chores_archive.py \
            --search-root /tmp/cora_data \
            --metadata-root "$metadata_root" \ \
            --root-only)"
          test -n "$root"
          python scripts/validate_cora_chores_archive.py \
            --search-root /tmp/cora_data \
            --metadata-root "$metadata_root" \
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Run real CORA CHORES task smoke
        env:
          ALFRED_DATA_DIR: ${{ steps.chores-data.outputs.root }}
          ALFRED_ROOT: /tmp/crl_alfred
          PYTHONPATH: /tmp/continual_rl:/tmp/crl_alfred
        run: xvfb-run -a python scripts/cora_legacy_chores_smoke.py
