name: recurrent-learning-acceptance

on:
  push:
    branches: [main]
    paths:
      - "src/rl_bgd/agents/ppo/recurrent_*.py"
      - "src/rl_bgd/agents/sac/recurrent_*.py"
      - "src/rl_bgd/models/recurrent_*.py"
      - "src/rl_bgd/runners/recurrent_bgd_stationary_lqr.py"
      - "tests/algorithms/test_recurrent_bgd_learning.py"
      - ".github/workflows/recurrent-learning.yml"
  pull_request:
    paths:
      - "src/rl_bgd/agents/ppo/recurrent_*.py"
      - "src/rl_bgd/agents/sac/recurrent_*.py"
      - "src/rl_bgd/models/recurrent_*.py"
      - "src/rl_bgd/runners/recurrent_bgd_stationary_lqr.py"
      - "tests/algorithms/test_recurrent_bgd_learning.py"
      - ".github/workflows/recurrent-learning.yml"

jobs:
  recurrent-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run recurrent BGD learning acceptance
        run: pytest tests/algorithms/test_recurrent_bgd_learning.py -m slow -q
