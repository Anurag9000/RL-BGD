name: format-recurrent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff==0.16.9"
      - name: Format recurrent additions
        run: |
          ruff format             src/rl_bgd/agents/ppo/recurrent_bgd_agent.py             src/rl_bgd/runners/recurrent_ppo_continual_lqr.py             tests/algorithms/test_recurrent_bgd_ppo.py             tests/integration/test_recurrent_ppo_continual.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/rl_bgd/agents/ppo/recurrent_bgd_agent.py             src/rl_bgd/runners/recurrent_ppo_continual_lqr.py             tests/algorithms/test_recurrent_bgd_ppo.py             tests/integration/test_recurrent_ppo_continual.py
          git commit -m "format recurrent BGD-PPO additions"
          git push origin HEAD:main
