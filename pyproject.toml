[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rl-bgd"
version = "0.1.0"
description = "Bayesian Gradient Descent and generalized online Bayesian mechanisms for task-agnostic continual reinforcement learning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Anurag Basistha"}]
dependencies = [
  "torch>=2.6",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "scipy>=1.14",
]

[project.optional-dependencies]
rl = ["gymnasium>=1.0"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9", "mypy>=1.14", "pre-commit>=4.0", "gymnasium>=1.0"]
# CARL 1.1.1 pins gymnasium<1.0.0; install this extra in a dedicated environment.
carl = ["carl-bench==1.1.1"]
continual-world = ["gymnasium>=1.0", "mujoco>=3.2", "metaworld>=3.0"]
continual-bench = [
  "continual-bench @ git+https://github.com/sail-sg/ContinualBench.git@a4fdb3b94a07a40d76e28d3aeab0f8ca97519dad",
  "metaworld>=3.0",
  "gym==0.26.2",
  "mujoco>=3.2,<4",
  "dm-tree>=0.1.8",
]
# CARL is intentionally excluded because its current Gymnasium pin conflicts.
all = ["gymnasium>=1.0", "mujoco>=3.2", "metaworld>=3.0"]

[project.scripts]
rl-bgd-smoke = "rl_bgd.runners.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_bgd"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: expensive tests excluded from routine runs",
  "gpu: requires CUDA",
  "benchmark: requires optional benchmark dependencies",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
packages = ["rl_bgd"]

[tool.hatch.metadata]
allow-direct-references = true
